<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#4d16d7">
<title>Phone.pe — Simulation</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#d8c6ff,#fff);
  color:#211052;
}

body{min-height:100vh}
button,input{font:inherit}
button{border:0;cursor:pointer}

.screen{
  display:none;
  min-height:100vh;
  padding:15px;
}

.screen.active{display:block}

.card{
  max-width:430px;
  min-height:calc(100vh - 30px);
  margin:auto;
  background:#fff;
  border-radius:28px;
  padding:20px;
  box-shadow:0 10px 35px rgba(50,15,120,.18);
}

.top{
  background:linear-gradient(145deg,#4010c8,#7620e9);
  color:#fff;
  padding:22px;
  border-radius:25px;
}

.brand{
  font-size:29px;
  font-weight:900;
}

.sim{
  display:inline-block;
  background:#ffe34b;
  color:#28135c;
  padding:7px 14px;
  border-radius:20px;
  font-size:11px;
  font-weight:900;
}

.title{
  font-size:29px;
  margin:18px 0 20px;
  color:#29106e;
}

.primary{
  width:100%;
  padding:15px;
  border-radius:15px;
  background:linear-gradient(90deg,#5918dc,#7b20e8);
  color:#fff;
  font-weight:900;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.option{
  background:#fff;
  border:1px solid #ded6ea;
  border-radius:22px;
  padding:18px 9px;
  text-align:center;
  box-shadow:0 5px 15px rgba(50,10,100,.1);
}

.option h3{
  font-size:17px;
  margin:0 0 15px;
}

.price{
  background:linear-gradient(90deg,#7517e0,#a521e9);
  color:#fff;
  font-size:29px;
  font-weight:900;
  padding:13px 4px;
  margin:0 -9px 15px;
}

.option ul{
  text-align:left;
  padding-left:20px;
  font-size:12px;
  line-height:1.9;
  min-height:125px;
}

.home-buttons{margin-top:18px}

.back{
  background:none;
  color:#3d128d;
  font-size:21px;
  padding:3px 0 12px;
}

.payment-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.amount{text-align:right}
.amount strong{
  display:block;
  font-size:30px;
}

.order{
  margin:16px 0;
  font-size:16px;
}

.qrbox{
  width:270px;
  height:270px;
  margin:20px auto;
  padding:12px;
  border:2px solid #ddd;
  border-radius:20px;
  background:#fff;
}

#demoQR{
  width:100%;
  height:100%;
  display:block;
}

.info{
  text-align:center;
  color:#645879;
  line-height:1.5;
}

.codebox{
  border:2px solid #dac8ef;
  border-radius:18px;
  padding:15px;
  margin-top:20px;
}

.codebox h3{
  color:#5015a5;
  margin:0 0 5px;
}

.code-row{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.code-row input{
  flex:1;
  min-width:0;
  border:2px solid #d7cee2;
  border-radius:12px;
  padding:13px;
  outline:none;
}

.unlock{
  background:#6020dc;
  color:white;
  border-radius:12px;
  padding:0 16px;
  font-weight:900;
}

.message{
  display:none;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  font-weight:800;
}

.message.show{display:block}
.error{
  background:#ffe3e3;
  color:#a30000;
}

.success{
  background:#dcffe7;
  color:#08752d;
}

/* PAYFAST HOME */

.dashboard{
  max-width:430px;
  margin:auto;
  background:#fff;
  min-height:100vh;
}

.dash
